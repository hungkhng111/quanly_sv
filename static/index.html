<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Đào Tạo</title>
    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .wrapper { display: flex; width: 100%; height: 100vh; overflow: hidden; }
        
        /* Sidebar Styling */
        .sidebar { width: 250px; background-color: #343a40; color: #fff; display: flex; flex-direction: column; transition: all 0.3s; }
        .sidebar .brand { padding: 20px; font-size: 1.2rem; font-weight: bold; text-align: center; border-bottom: 1px solid #4f5962; background: #2c3136; }
        .sidebar .nav-link { color: #c2c7d0; padding: 15px 20px; border-radius: 0; margin-bottom: 0; cursor: pointer; transition: 0.2s; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background-color: #007bff; color: #fff; }
        .sidebar .nav-link i { width: 25px; text-align: center; margin-right: 10px; }
        
        /* Main Content Styling */
        .main-panel { flex-grow: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .top-navbar { background: #fff; padding: 15px 25px; box-shadow: 0 2px 4px rgba(0,0,0,.08); display: flex; justify-content: space-between; align-items: center; z-index: 10;}
        .content { padding: 25px; }
        
        /* Card & Table Styling */
        .card { border: none; border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,.05); margin-bottom: 20px; }
        .card-header { background-color: #fff; border-bottom: 1px solid #edf2f9; font-weight: 600; padding: 15px 20px; border-radius: 8px 8px 0 0 !important; }
        .table-hover tbody tr:hover { background-color: #f8f9fa; }
        .table thead { border-bottom: 2px solid #dee2e6; }
        .table th { font-weight: 600; color: #495057; background-color: #f8f9fa; border-top: none; }
        
        /* Action Buttons */
        .action-btn { cursor: pointer; padding: 5px 8px; border-radius: 4px; transition: 0.2s; color: #6c757d; border: none; background: transparent; }
        .action-btn:hover { background: #e9ecef; }
        .btn-view { color: #0d6efd; }
        .btn-delete { color: #dc3545; }
        
        /* Hidden Tabs (Using Bootstrap Tab Logic but custom UI) */
        .tab-content { width: 100%; }
        .search-box { max-width: 350px; } /* Mở rộng ô tìm kiếm để chứa nút */
    </style>
</head>
<body>

<div class="wrapper">
    <!-- SIDEBAR -->
    <nav class="sidebar">
        <div class="brand">
            <i class="fa-solid fa-graduation-cap text-info me-2"></i> QL Đào Tạo
        </div>
        <div class="nav flex-column nav-pills mt-3" id="v-pills-tab" role="tablist" aria-orientation="vertical">
            <a class="nav-link active" id="tab-students" data-bs-toggle="pill" data-bs-target="#students" role="tab">
                <i class="fa-solid fa-users"></i> Quản lý Sinh Viên
            </a>
            <a class="nav-link" id="tab-subjects" data-bs-toggle="pill" data-bs-target="#subjects" role="tab">
                <i class="fa-solid fa-book"></i> Quản lý Môn Học
            </a>
        </div>
    </nav>

    <!-- MAIN PANEL -->
    <div class="main-panel">
        <!-- TOP NAVBAR -->
        <header class="top-navbar">
            <h5 class="mb-0 text-secondary" id="page-title">Quản lý Sinh Viên</h5>
            <div class="user-profile dropdown">
                <span class="text-secondary fw-semibold"><i class="fa-solid fa-circle-user fs-4 align-middle me-2"></i> Admin</span>
            </div>
        </header>

        <!-- CONTENT AREA -->
        <div class="content">
            <div class="tab-content">
                
                <!-- TAB: SINH VIÊN -->
                <div class="tab-pane fade show active" id="students" role="tabpanel">
                    <div class="row">
                        <!-- Form -->
                        <div class="col-lg-3 col-md-4">
                            <div class="card">
                                <div class="card-header text-primary"><i class="fa-solid fa-user-plus me-2"></i> <span id="studentFormTitle">Thêm Sinh Viên</span></div>
                                <div class="card-body">
                                    <form id="studentForm" onsubmit="event.preventDefault();">
                                        <div class="form-floating mb-3">
                                            <input type="text" class="form-control" id="stMssv" placeholder="MSSV" required>
                                            <label>Mã số sinh viên (MSSV)</label>
                                        </div>
                                        <div class="form-floating mb-3">
                                            <input type="text" class="form-control" id="stName" placeholder="Họ và Tên" required>
                                            <label>Họ và Tên</label>
                                        </div>
                                        <div class="form-floating mb-3">
                                            <input type="text" class="form-control" id="stClass" placeholder="Lớp" required>
                                            <label>Lớp học</label>
                                        </div>
                                        <div class="form-floating mb-3">
                                            <input type="text" class="form-control" id="stMajor" placeholder="Ngành" required>
                                            <label>Ngành học</label>
                                        </div>
                                        <div class="form-floating mb-4">
                                            <input type="text" class="form-control bg-light" id="stGpa" placeholder="GPA" readonly>
                                            <label>Điểm TB Tích Lũy (GPA)</label>
                                        </div>
                                        <div class="d-flex gap-2">
                                            <button type="button" class="btn btn-outline-secondary w-50" onclick="resetStudentForm()"><i class="fa-solid fa-rotate-left"></i> Làm mới</button>
                                            <button type="button" class="btn btn-primary w-50" onclick="saveStudent()"><i class="fa-solid fa-floppy-disk"></i> Lưu</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>

                        <!-- Data Grid -->
                        <div class="col-lg-9 col-md-8">
                            <div class="card">
                                <div class="card-header d-flex justify-content-between align-items-center">
                                    <span><i class="fa-solid fa-list me-2"></i> Danh Sách Sinh Viên</span>
                                    <!-- Ô TÌM KIẾM CÓ NÚT BẤM -->
                                    <div class="input-group input-group-sm search-box">
                                        <input type="text" id="searchStudent" class="form-control" placeholder="Nhập MSSV hoặc Tên..." onkeypress="if(event.key === 'Enter') loadStudents()">
                                        <button class="btn btn-primary px-3" type="button" onclick="loadStudents()"><i class="fa-solid fa-magnifying-glass"></i> Tìm</button>
                                        <button class="btn btn-outline-danger" type="button" onclick="clearStudentSearch()" title="Xóa bộ lọc"><i class="fa-solid fa-xmark"></i></button>
                                    </div>
                                </div>
                                <div class="card-body p-0">
                                    <div class="table-responsive">
                                        <table class="table table-hover align-middle text-center mb-0">
                                            <thead>
                                                <tr>
                                                    <th>MSSV</th>
                                                    <th class="text-start">Họ Tên</th>
                                                    <th>Lớp</th>
                                                    <th>Ngành</th>
                                                    <th>GPA</th>
                                                    <th>Thao Tác</th>
                                                </tr>
                                            </thead>
                                            <tbody id="studentTableBody"></tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- TAB: MÔN HỌC -->
                <div class="tab-pane fade" id="subjects" role="tabpanel">
                    <div class="row">
                        <!-- Form -->
                        <div class="col-lg-3 col-md-4">
                            <div class="card">
                                <div class="card-header text-success"><i class="fa-solid fa-book-medical me-2"></i> <span id="subjectFormTitle">Thêm Môn Học</span></div>
                                <div class="card-body">
                                    <form id="subjectForm" onsubmit="event.preventDefault();">
                                        <div class="form-floating mb-3">
                                            <input type="text" class="form-control" id="subId" placeholder="Mã Môn" required>
                                            <label>Mã Môn</label>
                                        </div>
                                        <div class="form-floating mb-3">
                                            <input type="text" class="form-control" id="subName" placeholder="Tên Môn" required>
                                            <label>Tên Môn Học</label>
                                        </div>
                                        <div class="form-floating mb-3">
                                            <input type="number" class="form-control" id="subCredits" placeholder="Tín Chỉ" required>
                                            <label>Số Tín Chỉ</label>
                                        </div>
                                        <div class="row g-2 mb-4">
                                            <div class="col-4 form-floating">
                                                <input type="number" class="form-control" id="subQt" value="20" required>
                                                <label>% QT</label>
                                            </div>
                                            <div class="col-4 form-floating">
                                                <input type="number" class="form-control" id="subGk" value="30" required>
                                                <label>% GK</label>
                                            </div>
                                            <div class="col-4 form-floating">
                                                <input type="number" class="form-control" id="subCk" value="50" required>
                                                <label>% CK</label>
                                            </div>
                                        </div>
                                        <div class="d-flex gap-2">
                                            <button type="button" class="btn btn-outline-secondary w-50" onclick="resetSubjectForm()"><i class="fa-solid fa-rotate-left"></i> Làm mới</button>
                                            <button type="button" class="btn btn-success w-50" onclick="saveSubject()"><i class="fa-solid fa-floppy-disk"></i> Lưu</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>

                        <!-- Data Grid -->
                        <div class="col-lg-9 col-md-8">
                            <div class="card">
                                <div class="card-header d-flex justify-content-between align-items-center">
                                    <span><i class="fa-solid fa-list me-2"></i> Danh Sách Môn Học</span>
                                    <!-- Ô TÌM KIẾM MÔN HỌC -->
                                    <div class="input-group input-group-sm search-box">
                                        <input type="text" id="searchSubject" class="form-control" placeholder="Tìm Tên môn hoặc Tín chỉ..." onkeypress="if(event.key === 'Enter') loadSubjects()">
                                        <button class="btn btn-primary px-3" type="button" onclick="loadSubjects()"><i class="fa-solid fa-magnifying-glass"></i> Tìm</button>
                                        <button class="btn btn-outline-danger" type="button" onclick="clearSubjectSearch()" title="Xóa bộ lọc"><i class="fa-solid fa-xmark"></i></button>
                                    </div>
                                </div>
                                <div class="card-body p-0">
                                    <div class="table-responsive">
                                        <table class="table table-hover align-middle text-center mb-0">
                                            <thead>
                                                <tr>
                                                    <th>Mã Môn</th>
                                                    <th class="text-start">Tên Môn</th>
                                                    <th>Tín Chỉ</th>
                                                    <th>QT (%)</th>
                                                    <th>GK (%)</th>
                                                    <th>CK (%)</th>
                                                    <th>Thao Tác</th>
                                                </tr>
                                            </thead>
                                            <tbody id="subjectTableBody"></tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // --- Cập nhật tiêu đề Top Navbar khi chuyển Tab ---
    document.querySelectorAll('.nav-link').forEach(tab => {
        tab.addEventListener('shown.bs.tab', function (event) {
            document.getElementById('page-title').innerText = event.target.innerText.trim();
        });
    });

    let currentEditMssv = null; 
    let currentEditSubId = null; 

    // ================= DATA LOADING =================
    async function loadSubjects() {
        // Lấy giá trị ô tìm kiếm (nếu có, không có thì bỏ qua)
        const searchInput = document.getElementById('searchSubject');
        const q = searchInput ? searchInput.value : '';
        const url = q ? `/api/subjects?q=${encodeURIComponent(q)}` : '/api/subjects';
        
        const res = await fetch(url);
        const data = await res.json();
        
        document.getElementById('subjectTableBody').innerHTML = data.map(s => `
            <tr style="cursor:pointer" onclick="selectSubject('${s.id}', '${s.name}', ${s.credits}, ${s.w_qt}, ${s.w_gk}, ${s.w_ck})">
                <td><span class="badge bg-light text-dark border">${s.id}</span></td>
                <td class="text-start fw-semibold text-primary">${s.name}</td>
                <td>${s.credits}</td><td>${s.w_qt}</td><td>${s.w_gk}</td><td>${s.w_ck}</td>
                <td><button class="action-btn btn-delete" title="Xóa" onclick="deleteSubject(event, '${s.id}')"><i class="fa-solid fa-trash-can"></i></button></td>
            </tr>
        `).join('');
    }

    async function loadStudents() {
        const searchInput = document.getElementById('searchStudent');
        const q = searchInput ? searchInput.value : '';
        const url = q ? `/api/students?q=${encodeURIComponent(q)}` : '/api/students';

        const res = await fetch(url);
        const data = await res.json();
        
        document.getElementById('studentTableBody').innerHTML = data.map(s => `
            <tr style="cursor:pointer" onclick="selectStudent('${s.mssv}', '${s.name}', '${s.class_name}', '${s.major}', ${s.gpa})">
                <td><span class="badge bg-light text-dark border">${s.mssv}</span></td>
                <td class="text-start fw-semibold text-primary">${s.name}</td>
                <td>${s.class_name}</td><td>${s.major}</td>
                <td><span class="badge ${s.gpa >= 5 ? 'bg-success' : (s.gpa > 0 ? 'bg-danger' : 'bg-secondary')} fs-6">${s.gpa}</span></td>
                <td>
                    <button class="action-btn btn-view" title="Xem điểm" onclick="goToGradesPage(event, '${s.mssv}', '${s.name}')"><i class="fa-solid fa-clipboard-list fs-5"></i></button>
                    <button class="action-btn btn-delete" title="Xóa" onclick="deleteStudent(event, '${s.mssv}')"><i class="fa-solid fa-trash-can fs-5"></i></button>
                </td>
            </tr>
        `).join('');
    }

    window.onload = () => { loadSubjects(); loadStudents(); };

    // Các hàm xóa bộ lọc
    function clearStudentSearch() {
        document.getElementById('searchStudent').value = '';
        loadStudents();
    }
    
    function clearSubjectSearch() {
        document.getElementById('searchSubject').value = '';
        loadSubjects();
    }

    // ================= CHUYỂN HƯỚNG TRANG =================
    function goToGradesPage(e, mssv, name) {
        e.stopPropagation();
        window.location.href = `grades.html?mssv=${encodeURIComponent(mssv)}&name=${encodeURIComponent(name)}`;
    }

    // ================= CRUD LOGIC =================
    function selectStudent(mssv, name, className, major, gpa) {
        currentEditMssv = mssv;
        document.getElementById('stMssv').value = mssv; document.getElementById('stName').value = name;
        document.getElementById('stClass').value = className; document.getElementById('stMajor').value = major; document.getElementById('stGpa').value = gpa;
        document.getElementById('studentFormTitle').innerText = "Cập Nhật Sinh Viên";
    }

    function resetStudentForm() {
        currentEditMssv = null; document.getElementById('studentForm').reset();
        document.getElementById('studentFormTitle').innerText = "Thêm Sinh Viên";
    }

    async function saveStudent() {
        const payload = {
            mssv: document.getElementById('stMssv').value, name: document.getElementById('stName').value,
            class_name: document.getElementById('stClass').value, major: document.getElementById('stMajor').value
        };
        const method = currentEditMssv ? 'PUT' : 'POST';
        const url = currentEditMssv ? `/api/students/${currentEditMssv}` : '/api/students';
        const res = await fetch(url, { method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
        if(res.ok) { loadStudents(); if(currentEditMssv) currentEditMssv = payload.mssv; } 
        else { const err = await res.json(); alert(err.detail); }
    }

    async function deleteStudent(e, mssv) {
        e.stopPropagation();
        if(confirm("Xóa sinh viên này (bao gồm cả điểm)?")) {
            const res = await fetch(`/api/students/${mssv}`, { method: 'DELETE' });
            if(res.ok) { resetStudentForm(); loadStudents(); }
        }
    }

    function selectSubject(id, name, credits, qt, gk, ck) {
        currentEditSubId = id;
        document.getElementById('subId').value = id; document.getElementById('subName').value = name; document.getElementById('subCredits').value = credits;
        document.getElementById('subQt').value = qt; document.getElementById('subGk').value = gk; document.getElementById('subCk').value = ck;
        document.getElementById('subjectFormTitle').innerText = "Cập Nhật Môn Học";
    }

    function resetSubjectForm() {
        currentEditSubId = null; document.getElementById('subjectForm').reset();
        document.getElementById('subjectFormTitle').innerText = "Thêm Môn Học";
    }

    async function saveSubject() {
        const payload = {
            id: document.getElementById('subId').value, name: document.getElementById('subName').value,
            credits: Number.parseInt(document.getElementById('subCredits').value),
            w_qt: Number.parseFloat(document.getElementById('subQt').value), w_gk: parseFloat(document.getElementById('subGk').value), w_ck: parseFloat(document.getElementById('subCk').value)
        };
        const method = currentEditSubId ? 'PUT' : 'POST';
        const url = currentEditSubId ? `/api/subjects/${currentEditSubId}` : '/api/subjects';
        const res = await fetch(url, { method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
        if(res.ok) { loadSubjects(); if(!currentEditSubId) resetSubjectForm(); }
        else { const err = await res.json(); alert(err.detail); }
    }

    async function deleteSubject(e, id) {
        e.stopPropagation();
        if(confirm("Xóa môn học này sẽ xóa toàn bộ điểm của sinh viên liên quan?")) {
            const res = await fetch(`/api/subjects/${id}`, { method: 'DELETE' });
            if(res.ok) { resetSubjectForm(); loadSubjects(); }
        }
    }
</script>
</body>
</html>
