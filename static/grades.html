<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Điểm - Hệ Thống Đào Tạo</title>
    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .wrapper { display: flex; width: 100%; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 250px; background-color: #343a40; color: #fff; display: flex; flex-direction: column; }
        .sidebar .brand { padding: 20px; font-size: 1.2rem; font-weight: bold; text-align: center; border-bottom: 1px solid #4f5962; background: #2c3136; }
        .sidebar .nav-link { color: #c2c7d0; padding: 15px 20px; cursor: pointer; transition: 0.2s; }
        .sidebar .nav-link:hover { background-color: #495057; color: #fff; }
        .sidebar .nav-link i { width: 25px; text-align: center; margin-right: 10px; }
        
        .main-panel { flex-grow: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .top-navbar { background: #fff; padding: 15px 25px; box-shadow: 0 2px 4px rgba(0,0,0,.08); display: flex; justify-content: space-between; align-items: center; z-index: 10;}
        .content { padding: 25px; }
        
        .card { border: none; border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,.05); margin-bottom: 20px; }
        .card-header { background-color: #fff; border-bottom: 1px solid #edf2f9; padding: 15px 20px; border-radius: 8px 8px 0 0 !important; }
        .table thead { background-color: #f8f9fa; border-bottom: 2px solid #dee2e6; }
        .table th { font-weight: 600; color: #495057; border-top: none; }
        .table-input { width: 80px; text-align: center; border-radius: 6px;}
        
        .student-info-bar { background: linear-gradient(135deg, #0d6efd 0%, #0dcaf0 100%); color: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,.1); display: flex; justify-content: space-between; align-items: center;}
        
        /* CSS DÀNH CHO THANH KÉO DUAL-THUMB SLIDER */
        .range-slider { position: relative; height: 24px; display: flex; align-items: center; flex-grow: 1;}
        .slider-track { position: absolute; width: 100%; height: 6px; background: #dee2e6; border-radius: 3px; z-index: 1;}
        .range-slider input[type="range"] { position: absolute; width: 100%; z-index: 2; pointer-events: none; -webkit-appearance: none; appearance: none; background: transparent; }
        .range-slider input[type="range"]::-webkit-slider-thumb { pointer-events: auto; -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #0d6efd; cursor: pointer; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
        
        /* Footer Styling */
        .app-footer { background-color: #fff; padding: 15px 25px; border-top: 1px solid #edf2f9; color: #6c757d; font-size: 0.9rem; text-align: center; margin-top: auto; }
    </style>
</head>
<body>

<div class="wrapper">
    <nav class="sidebar">
        <div class="brand"><i class="fa-solid fa-graduation-cap text-info me-2"></i> QL Đào Tạo</div>
        <div class="nav flex-column mt-3">
            <a class="nav-link" href="index.html"><i class="fa-solid fa-arrow-left"></i> Quay lại Danh Sách</a>
        </div>
    </nav>

    <div class="main-panel">
        <header class="top-navbar">
            <h5 class="mb-0 text-secondary">Hồ Sơ Điểm Sinh Viên</h5>
            <div class="user-profile"><span class="text-secondary fw-semibold"><i class="fa-solid fa-circle-user fs-4 align-middle me-2"></i> Admin</span></div>
        </header>

        <div class="content">
            <div class="student-info-bar">
                <div>
                    <span class="badge bg-light text-primary mb-2 border-0">MSSV: <span id="gpMssv"></span></span>
                    <h4 class="mb-0 fw-bold"><i class="fa-solid fa-user-graduate me-2"></i> <span id="gpName"></span></h4>
                </div>
                <div style="background: rgba(255,255,255,0.2); padding: 10px 20px; border-radius: 30px; font-size: 1.2rem; font-weight: bold;">
                    GPA: <span id="gpGpa">...</span>
                </div>
            </div>

            <div class="bg-white p-3 rounded border shadow-sm mb-3">
                <div class="row g-3 align-items-center">
                    <div class="col-md-3">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-book"></i></span>
                            <input type="text" id="filterSubName" class="form-control" placeholder="Tên môn học..." onkeypress="if(event.key === 'Enter') loadGradesData()">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="d-flex align-items-center gap-3">
                            <span class="text-muted fw-bold small text-nowrap">Khoảng điểm:</span>
                            <span class="badge bg-primary text-white" id="lblMin" style="width: 40px;">0.0</span>
                            
                            <div class="range-slider mx-2">
                                <div class="slider-track"></div>
                                <input type="range" id="filterMin" min="0" max="10" step="0.1" value="0">
                                <input type="range" id="filterMax" min="0" max="10" step="0.1" value="10">
                            </div>

                            <span class="badge bg-danger text-white" id="lblMax" style="width: 40px;">10.0</span>
                        </div>
                    </div>
                    <div class="col-md-3 d-flex gap-2">
                        <button class="btn btn-sm btn-primary flex-grow-1" type="button" onclick="loadGradesData()"><i class="fa-solid fa-filter"></i> Lọc KQ</button>
                        <button class="btn btn-sm btn-outline-danger" type="button" onclick="clearGradeFilter()" title="Xóa bộ lọc"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 fw-bold text-secondary"><i class="fa-solid fa-chart-line me-2"></i> Bảng Điểm Chi Tiết</h5>
                    <button class="btn btn-success btn-sm rounded-pill px-3" type="button" onclick="addGradeRow()"><i class="fa-solid fa-plus me-1"></i> Thêm Môn</button>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle text-center mb-0">
                            <thead>
                                <tr>
                                    <th class="text-start ps-4" style="width: 25%">Môn Học</th>
                                    <th>Quá Trình</th><th>Giữa Kỳ</th><th>Cuối Kỳ</th><th>Tổng Kết</th><th>Thao Tác</th>
                                </tr>
                            </thead>
                            <tbody id="gradesTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- FOOTER BẢN QUYỀN -->
        <footer class="app-footer">
            &copy; <script>document.write(new Date().getFullYear())</script> <strong>Nguyễn Khánh Hưng</strong>. All rights reserved.
        </footer>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let allSubjects = [];
    let activeGradeStudentId = null;

    const filterMin = document.getElementById('filterMin');
    const filterMax = document.getElementById('filterMax');
    const lblMin = document.getElementById('lblMin');
    const lblMax = document.getElementById('lblMax');

    function syncSliders() {
        let min = parseFloat(filterMin.value);
        let max = parseFloat(filterMax.value);
        if (min > max) { let tmp = min; min = max; max = tmp; filterMin.value = min; filterMax.value = max; }
        lblMin.innerText = min.toFixed(1);
        lblMax.innerText = max.toFixed(1);
    }
    filterMin.addEventListener('input', syncSliders);
    filterMax.addEventListener('input', syncSliders);

    window.onload = async () => {
        const urlParams = new URLSearchParams(window.location.search);
        activeGradeStudentId = urlParams.get('mssv');
        const studentName = urlParams.get('name');
        if (!activeGradeStudentId) { window.location.href = 'index.html'; return; }

        document.getElementById('gpMssv').innerText = activeGradeStudentId;
        document.getElementById('gpName').innerText = studentName;

        const resSub = await fetch('/api/subjects');
        allSubjects = await resSub.json();
        loadGradesData(); refreshGpa(); 
    };

    async function loadGradesData() {
        const subName = document.getElementById('filterSubName').value;
        const minVal = document.getElementById('filterMin').value;
        const maxVal = document.getElementById('filterMax').value;
        
        let url = `/api/grades/${activeGradeStudentId}?`;
        if (subName) url += `sub_name=${encodeURIComponent(subName)}&`;
        if (minVal !== "") url += `min_score=${minVal}&`;
        if (maxVal !== "") url += `max_score=${maxVal}&`;

        const res = await fetch(url);
        const data = await res.json();
        document.getElementById('gradesTableBody').innerHTML = data.map(g => 
            createGradeRowHTML(g.subject_id, g.subject_name, g.qt, g.gk, g.ck, g.total, false)
        ).join('');
    }

    function clearGradeFilter() {
        document.getElementById('filterSubName').value = ""; filterMin.value = 0; filterMax.value = 10;
        syncSliders(); loadGradesData();
    }

    async function refreshGpa() {
        const res = await fetch('/api/students');
        const students = await res.json();
        const currentStudent = students.find(s => s.mssv === activeGradeStudentId);
        if(currentStudent) document.getElementById('gpGpa').innerText = currentStudent.gpa;
    }

    function formatScore(score) { return score === -1 ? '' : score; }
    function formatTotal(total) { 
        if (total === null) return '<span class="badge bg-secondary rounded-pill">Chưa đủ</span>';
        return `<span class="badge ${total >= 5 ? 'bg-success' : 'bg-danger'} rounded-pill fs-6">${total}</span>`; 
    }

    function createGradeRowHTML(subId, subName, qt, gk, ck, total, isEditMode) {
        if(isEditMode) {
            let subjectCol = `<td class="text-start ps-4"><input type="hidden" class="sub-val" value="${subId}"><span class="fw-semibold text-primary">${subName}</span></td>`;
            let saveFn = `updateGradeRow(this)`;
            if(!subId) {
                const options = allSubjects.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
                subjectCol = `<td class="text-start ps-4"><select class="form-select sub-val shadow-sm border-primary">${options}</select></td>`;
                saveFn = `addGradeRowAPI(this)`;
            }
            return `
                <tr class="table-primary bg-opacity-10">
                    ${subjectCol}
                    <td><input type="number" class="form-control form-control-sm table-input mx-auto qt-val" value="${formatScore(qt)}" step="0.1" min="0" max="10" placeholder="-"></td>
                    <td><input type="number" class="form-control form-control-sm table-input mx-auto gk-val" value="${formatScore(gk)}" step="0.1" min="0" max="10" placeholder="-"></td>
                    <td><input type="number" class="form-control form-control-sm table-input mx-auto ck-val" value="${formatScore(ck)}" step="0.1" min="0" max="10" placeholder="-"></td>
                    <td><span class="badge bg-warning text-dark">Đang sửa...</span></td>
                    <td>
                        <button class="btn btn-sm btn-success rounded-circle me-1 shadow-sm" type="button" onclick="${saveFn}" title="Lưu"><i class="fa-solid fa-check"></i></button>
                        <button class="btn btn-sm btn-outline-secondary rounded-circle" type="button" onclick="loadGradesData()" title="Hủy"><i class="fa-solid fa-xmark"></i></button>
                    </td>
                </tr>`;
        } else {
            return `
                <tr>
                    <td class="text-start ps-4 fw-semibold text-dark">${subName}</td>
                    <td>${formatScore(qt)}</td><td>${formatScore(gk)}</td><td>${formatScore(ck)}</td>
                    <td>${formatTotal(total)}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary rounded-circle me-1 border-0 shadow-none" type="button" onclick="editGradeRow(this, '${subId}', '${subName}', ${qt}, gk, ck)" title="Sửa"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button class="btn btn-sm btn-outline-danger rounded-circle border-0 shadow-none" type="button" onclick="deleteGrade('${subId}')" title="Xóa"><i class="fa-solid fa-trash-can"></i></button>
                    </td>
                </tr>`;
        }
    }

    function addGradeRow() { if (allSubjects.length === 0) { alert("Chưa có môn học nào!"); return; } document.getElementById('gradesTableBody').insertAdjacentHTML('afterbegin', createGradeRowHTML("", "", -1, -1, -1, null, true)); }
    function editGradeRow(btn, subId, subName, qt, gk, ck) { btn.closest('tr').outerHTML = createGradeRowHTML(subId, subName, qt, gk, ck, null, true); }
    
    function getPayloadFromRow(tr) {
        return {
            mssv: activeGradeStudentId, subject_id: tr.querySelector('.sub-val').value,
            qt: tr.querySelector('.qt-val').value === "" ? -1 : parseFloat(tr.querySelector('.qt-val').value),
            gk: tr.querySelector('.gk-val').value === "" ? -1 : parseFloat(tr.querySelector('.gk-val').value),
            ck: tr.querySelector('.ck-val').value === "" ? -1 : parseFloat(tr.querySelector('.ck-val').value)
        };
    }
    
    async function addGradeRowAPI(btn) {
        const res = await fetch('/api/grades', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(getPayloadFromRow(btn.closest('tr'))) });
        if(res.ok) { loadGradesData(); refreshGpa(); } else { const err = await res.json(); alert(err.detail); }
    }
    async function updateGradeRow(btn) {
        const res = await fetch('/api/grades', { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(getPayloadFromRow(btn.closest('tr'))) });
        if(res.ok) { loadGradesData(); refreshGpa(); } else { const err = await res.json(); alert(err.detail); }
    }
    async function deleteGrade(subId) {
        if(confirm("Xóa điểm môn này?")) { const res = await fetch(`/api/grades/${activeGradeStudentId}/${subId}`, { method: 'DELETE' }); if(res.ok) { loadGradesData(); refreshGpa(); } }
    }
</script>
</body>
</html>
